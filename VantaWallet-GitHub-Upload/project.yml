name: VantaWallet
options:
  bundleIdPrefix: com.vanta
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_NSFaceIDUsageDescription: "Вход в защищённый демо-редактор VANTA WALLET."
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
    CODE_SIGN_STYLE: Automatic
targets:
  VantaWallet:
    type: application
    platform: iOS
    sources:
      - path: VantaWallet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vanta.wallet
        PRODUCT_NAME: VANTA WALLET
        INFOPLIST_KEY_CFBundleDisplayName: VANTA WALLET
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: YES
